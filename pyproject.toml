[project]
name = "studioclear"
version = "0.1.0"
description = "Agentic Script Clearance Research Desk — Google Cloud Agentic Cinema (Parallel Track)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
