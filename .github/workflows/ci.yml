name: ci

# sol.md §12 — quality gate. Installs the real dependencies so the API/integration
# path is actually exercised (no silent skips), runs lint + the full offline test
# suite, and gates on the golden eval. No live API keys: every test uses the mock
# / example providers, so nothing here calls Gemini or Parallel.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check studioclear tests app

      - name: Tests (offline / deterministic — unit, adversarial, integration)
        run: pytest tests/

      # Gate: recall regression on the legacy golden set blocks merge.
      - name: Golden eval (legacy regression, cached)
        run: python -m studioclear.evals.run_golden --cached demo/cached_run.json

      # Smoke: the unseen-scene harness runs and keeps citation integrity perfect.
      # Real quality numbers are produced separately with --mode live.
      - name: Unseen-scene eval harness smoke (example mode)
        run: python -m studioclear.evals.unseen_eval --mode example
