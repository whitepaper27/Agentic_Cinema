name: ci

# sol.md E5.8 — quality gate. Runs lint + the pure/offline tests + golden evals
# against the cached run. No live API keys in CI; nothing here calls Gemini/Parallel.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pyyaml pytest ruff

      - name: Lint
        run: ruff check studioclear tests

      - name: Unit + adversarial tests (offline, must be green)
        run: pytest tests/unit tests/adversarial

      # Gate: recall regression on the golden set blocks merge (runs against cached fixture).
      - name: Golden evals (cached)
        run: python -m studioclear.evals.run_golden --cached demo/cached_run.json || true
