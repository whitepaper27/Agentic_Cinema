<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StudioClear — Scene research & revision desk</title>
<style>
  /* sol_ui.md §14 — a light production binder. Color is reserved for research
     status; the source material carries the visual interest. No clearance stamps. */
  :root{
    --paper:#f5f2eb; --surface:#fff; --ink:#202a35; --muted:#56616d; --line:#d4d8dc;
    --accent:#245b78; --supported:#256345; --contradicted:#a32832; --mixed:#80530c;
    --unresolved:#675080; --stale:#56616d;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"Courier New",Courier,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.55 var(--sans);background:var(--paper);color:var(--ink)}
  a{color:var(--accent)}
  .mono{font-family:var(--mono)}
  button{font:600 14px var(--sans);background:var(--accent);color:#fff;border:0;
    padding:9px 15px;border-radius:6px;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button.ghost:hover{background:rgba(32,42,53,.05);filter:none}
  button:disabled{opacity:.45;cursor:default}
  input[type=text],textarea{width:100%;font:15px var(--sans);padding:9px;border:1px solid var(--line);
    border-radius:6px;background:#fff;color:var(--ink)}
  textarea{resize:vertical}
  label{font-size:13px;color:var(--muted);display:block;margin:0 0 5px}
  header{background:var(--ink);color:#fff;padding:12px 22px;display:flex;justify-content:space-between;
    align-items:center;gap:14px;flex-wrap:wrap}
  header .b{font-weight:600;font-size:17px}
  header .b span{color:#aeb8c2;font-weight:400;font-size:12.5px;display:block}
  header .meta{font-size:12.5px;color:#aeb8c2;text-align:right}
  .badge{display:inline-block;font:600 11px var(--mono);padding:2px 8px;border-radius:10px;
    border:1px solid currentColor;text-transform:uppercase;letter-spacing:.5px}
  .badge.live{color:#8fe3b0} .badge.sim{color:#e7c98f}
  nav{display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px}
  nav .tab{padding:11px 16px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;
    border-bottom:2px solid transparent}
  nav .tab.active{color:var(--ink);border-bottom-color:var(--accent)}
  nav .tab[aria-disabled=true]{opacity:.4;cursor:default}
  main{max-width:1200px;margin:0 auto;padding:22px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:20px;margin-bottom:16px}
  h1{font-size:22px;margin:0 0 4px} h2{font-size:17px;margin:0 0 10px}
  .lede{color:var(--muted);margin:0 0 18px;max-width:60ch}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:14px}
  .seg button{background:#fff;color:var(--ink);border:0;border-right:1px solid var(--line);border-radius:0;font-weight:600}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:#fff}
  .hint{font-size:12.5px;color:var(--muted);margin:5px 0}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
  .chip{font-size:12.5px;padding:5px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;color:var(--ink)}
  .drop{border:1.5px dashed var(--line);border-radius:8px;padding:20px;text-align:center;color:var(--muted);background:#fbfaf7}
  .thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .thumb{width:96px;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:11px;text-align:center;background:#fff}
  .thumb img{width:100%;height:64px;object-fit:cover;border-radius:3px}
  .thumb button{margin-top:4px;padding:2px 6px;font-size:11px}
  .err{color:var(--contradicted);font-size:13.5px;margin:8px 0}
  .ok{color:var(--supported)}
  .status{font-weight:600;font-size:12.5px}
  .s-SUPPORTED{color:var(--supported)} .s-CONTRADICTED{color:var(--contradicted)}
  .s-MIXED{color:var(--mixed)} .s-UNRESOLVED{color:var(--unresolved)}
  .s-NOT_RESEARCHED{color:var(--stale)} .s-STALE{color:var(--stale)}
  .desk{display:grid;grid-template-columns:45% 55%;gap:0}
  @media(max-width:860px){.desk{grid-template-columns:1fr}}
  .src{border-right:1px solid var(--line);padding-right:20px}
  @media(max-width:860px){.src{border-right:0;border-bottom:1px solid var(--line);padding-right:0;padding-bottom:16px}}
  .inv{padding-left:20px}
  @media(max-width:860px){.inv{padding-left:0;padding-top:16px}}
  .scenebox{font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;background:#fbfaf7;border:1px solid var(--line);
    border-radius:6px;padding:12px;max-height:340px;overflow:auto}
  .frow{padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
  .frow:hover{background:#fbfaf7}
  .frow.sel{background:#fbfaf7;box-shadow:inset 3px 0 0 var(--accent)}
  .frow .claim{font-weight:600;font-size:14px}
  .frow .loc{font-size:12px;color:var(--muted);font-family:var(--mono)}
  .grouphd{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 4px}
  .passage{border-left:3px solid var(--line);padding:6px 0 6px 12px;margin:8px 0;font-size:14px}
  .passage.supports{border-color:var(--supported)} .passage.contradicts{border-color:var(--contradicted)}
  .passage .rel{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)}
  .passage .meta{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:3px}
  .diff ins{background:#dff0e4;text-decoration:none;padding:0 2px}
  .diff del{background:#f6dcdf;padding:0 2px}
  .diff{font-family:var(--mono);font-size:14px;line-height:1.7;background:#fbfaf7;border:1px solid var(--line);border-radius:6px;padding:12px;margin:8px 0}
  .kv{font-size:13px;color:var(--muted);margin:4px 0}
  .kv b{color:var(--ink)}
  details>summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  td,th{padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:top}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .banner{padding:10px 14px;border-radius:7px;font-size:13.5px;margin-bottom:14px}
  .banner.info{background:#e9f0f3;color:#1b4459} .banner.warn{background:#f6ecd9;color:#6a4b06}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion){.spin{animation:none}}
  @media print{header,nav,.noprint{display:none!important}.card{border:0;padding:0}main{max-width:none}}
</style>
</head>
<body>
<header>
  <div class="b">StudioClear<span>Scene research &amp; revision desk</span></div>
  <div class="meta" id="projmeta"></div>
</header>
<nav id="nav">
  <div class="tab active" data-view="analyze">Analyze a scene</div>
  <div class="tab" data-view="desk" data-gate="run">Scene desk</div>
  <div class="tab" data-view="handoff" data-gate="run">Handoff</div>
  <div class="tab" data-view="exec" data-gate="run">Execution</div>
</nav>
<main>
  <div id="view"></div>
</main>

<script>
"use strict";
const S = {                       // minimal frontend state (sol_ui.md §16)
  view:"analyze", mode:"paste",   // input mode: paste | images
  runMode:"live",                 // provider mode: live | example
  images:[],                      // {name, dataUrl}
  scene:null, run:null, sel:null, proposal:null, busy:false, error:"", expired:false, handoff:null,
};
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el=id=>document.getElementById(id);

const STATUS_LABEL={SUPPORTED:"Supported by retrieved evidence",CONTRADICTED:"Evidence challenges this detail",
  MIXED:"Sources disagree",UNRESOLVED:"Not enough evidence",NOT_RESEARCHED:"Not researched",STALE:"Recheck needed"};
const ROUTE_LABEL={REVIEW:"Human review requested",ESCALATE:"Escalated for review",NONE:""};
const RANK={CONTRADICTED:0,MIXED:1,UNRESOLVED:2,STALE:3,NOT_RESEARCHED:4,SUPPORTED:5};

async function api(path,opts){
  const r=await fetch(path,Object.assign({headers:{"Content-Type":"application/json"}},opts||{}));
  if(r.status===410){ S.expired=true; renderExpired(); throw new Error("expired"); }
  const body=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(body.detail||("HTTP "+r.status));
  return body;
}
function renderExpired(){
  el("view").innerHTML=`<div class="card"><h1>This scene expired</h1>
    <p class="lede">This scene expired after 24 hours and is no longer available in
    StudioClear. A handoff you already downloaded remains yours.</p>
    <button onclick="location.reload()">Analyze a new scene</button></div>`;
}
function domainOf(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u||""}}
function fmt(iso){if(!iso)return"";const d=new Date(iso);return isNaN(d)?iso:d.toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"UTC"})+" UTC"}

async function setView(v){ if(v!=="analyze"&&!S.run)return; S.view=v;
  if(v==="handoff"){ S.handoff=null; render();   // show loading, then fetch the one snapshot
    try{ S.handoff=await api("/report/"+S.run.run_id); }catch(e){ S.error=String(e.message||e); } }
  render(); }
function render(){
  document.querySelectorAll("nav .tab").forEach(t=>{
    t.classList.toggle("active",t.dataset.view===S.view);
    if(t.dataset.gate==="run") t.setAttribute("aria-disabled", S.run?"false":"true");
  });
  el("projmeta").innerHTML = S.scene ? projMeta() : "";
  const host=el("view");
  if(S.view==="analyze") host.innerHTML=viewAnalyze();
  else if(S.view==="desk") host.innerHTML=viewDesk();
  else if(S.view==="handoff") host.innerHTML=viewHandoff();
  else if(S.view==="exec") host.innerHTML=viewExec();
  wire();
}
function fmtExpiry(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return iso;
  return d.toISOString().replace('.000','').replace('T',' ').replace('Z',' UTC')
    + " (" + d.toLocaleString() + " local)"; }
function projMeta(){
  const modeBadge = S.run
    ? (S.run.provider_mode==="live"?'<span class="badge live">Processed live</span>'
                                   :'<span class="badge sim">Simulated example</span>')
    : "";
  const v = S.scene? "Scene v"+S.scene.current_version : "";
  const rc = S.run && S.run.stale ? " · Recheck needed" : "";
  const exp = S.scene && S.scene.expires_at
    ? `<br><span style="color:#aeb8c2">Expires ${esc(fmtExpiry(S.scene.expires_at))} · editing does not extend this</span>` : "";
  return `${esc(S.scene.title||"Untitled")} · ${v}${rc} &nbsp; ${modeBadge}${exp}`;
}
document.querySelectorAll("nav .tab").forEach(t=>t.onclick=()=>setView(t.dataset.view));

/* ---------------- Analyze a scene ---------------- */
function viewAnalyze(){
  return `<div class="card">
    <h1>Make the smallest change your scene needs.</h1>
    <p class="lede">Bring a storyboard or paste a scene. Investigate factual details,
      compare evidence-backed revisions, and keep your creative intent.</p>
    ${S.error?`<div class="err">${esc(S.error)}</div>`:""}
    <div class="seg" role="tablist">
      <button class="${S.mode==="images"?"on":""}" data-m="images">Storyboard / comic pages</button>
      <button class="${S.mode==="paste"?"on":""}" data-m="paste">Paste a scene</button>
    </div>
    ${S.mode==="images"?imagesInput():textInput()}
    <div style="margin-top:16px">
      <label for="instr">What should we investigate or preserve?</label>
      <textarea id="instr" rows="2" placeholder="Check historical accuracy. Preserve the characters, joke, and ending."></textarea>
      <div class="chips">
        <span class="chip" data-ins="Check factual details">Check factual details</span>
        <span class="chip" data-ins="Investigate this reference">Investigate this reference</span>
        <span class="chip" data-ins="Preserve my dialogue">Preserve my dialogue</span>
      </div>
    </div>
    <p class="hint">Your material is read by Google Gemini; research questions are sent to Parallel.
      Nothing here promises legal clearance, automatic redrawing, or guaranteed accuracy.</p>
    <p class="hint"><b>Available for 24 hours after creation.</b> Access expires automatically;
      stored copies are then removed through automated cleanup. Editing does not extend this time.
      Downloaded copies remain with you.</p>
    <div class="row" style="margin-top:8px">
      <button id="readBtn">${S.busy?'<span class="spin"></span> Reading your scene…':'Read my scene'}</button>
      <button class="ghost" id="exampleBtn" ${S.busy?"disabled":""}>Try an example</button>
    </div>
    <p class="hint">“Try an example” runs a labeled <b>Simulated example</b> (deterministic fixture), not a live upload.</p>
  </div>`;
}
function textInput(){
  return `<label for="txt">Scene text</label>
    <textarea id="txt" rows="9" placeholder="Paste dialogue, captions, or a screenplay scene. Special headings are optional."></textarea>
    <div class="hint"><span id="cc">0</span> / 20,000 characters</div>`;
}
function imagesInput(){
  const th=S.images.map((im,i)=>`<div class="thumb"><img src="${im.dataUrl}" alt="page ${i+1}"/>
    <div>${esc(im.name).slice(0,14)}</div><button class="ghost" data-rm="${i}">Remove</button></div>`).join("");
  return `<div class="drop" id="drop">Drop up to 3 pages here, or
      <label style="display:inline"><a href="#" id="pick">choose files</a>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></label>
      <div class="hint">PNG, JPEG, or WebP · up to 3 pages · 4 MiB per page</div></div>
    <div class="thumbs">${th}</div>`;
}
function wireAnalyze(){
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.error="";render()});
  document.querySelectorAll("[data-ins]").forEach(c=>c.onclick=()=>{const t=el("instr");t.value=(t.value?t.value+" ":"")+c.dataset.ins});
  const txt=el("txt"); if(txt) txt.oninput=()=>{el("cc").textContent=txt.value.length};
  const file=el("file");
  if(file){
    el("pick").onclick=e=>{e.preventDefault();file.click()};
    file.onchange=()=>addFiles(file.files);
    const d=el("drop");
    d.ondragover=e=>{e.preventDefault()}; d.ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.images.splice(+b.dataset.rm,1);render()});
  }
  el("readBtn").onclick=()=>readScene("live");
  el("exampleBtn").onclick=()=>readScene("example");
}
function addFiles(files){
  S.error="";
  const list=[...files].slice(0,3-S.images.length);
  let pending=list.length; if(!pending)return;
  list.forEach(f=>{
    if(!["image/png","image/jpeg","image/webp"].includes(f.type)){S.error="Unsupported type: "+f.name;pending--;return}
    if(f.size>4*1024*1024){S.error=f.name+" exceeds 4 MiB";pending--;return}
    const r=new FileReader();
    r.onload=()=>{S.images.push({name:f.name,dataUrl:r.result});if(--pending===0)render()};
    r.readAsDataURL(f);
  });
}
const EXAMPLE_SCENE=`INT. MISSION CONTROL - NIGHT

NARRATOR (V.O.)
It was the Apollo 11 Moon landing in 1968 that changed everything.

MAYA
And the Berlin Wall fell in 1989 - the world was opening up.
She lifts a Nikon camera to the window.`;

async function readScene(mode){
  S.error=""; S.runMode=mode;
  const instruction=(el("instr").value||"").trim()||"Check historical accuracy. Preserve the dialogue.";
  let payload={mode,source_type:S.mode,instruction,title:"Scene"};
  if(mode==="example" && S.mode==="paste" && !(el("txt").value||"").trim()){
    // "Try an example" loads a built-in scene, analyzed in simulated mode.
    payload.script_text=EXAMPLE_SCENE; payload.title="Example scene";
  }else if(S.mode==="paste"){
    const text=(el("txt").value||"").trim();
    if(!text){S.error="Paste a scene first.";return render()}
    payload.script_text=text;
  }else{
    if(!S.images.length){S.error="Add at least one page.";return render()}
    payload.images=S.images.map(i=>i.dataUrl);
  }
  S.busy=true; render();
  try{
    S.scene=await api("/scenes",{method:"POST",body:JSON.stringify(payload)});
    S.busy=false; S.view="confirm"; renderConfirm();
  }catch(e){ S.busy=false; S.error=String(e.message||e); render(); }
}

/* ---------------- Confirm extraction (sol_ui.md §5) ---------------- */
function renderConfirm(){
  el("projmeta").innerHTML=projMeta();
  document.querySelectorAll("nav .tab").forEach(t=>t.classList.remove("active"));
  const v=S.scene.versions[S.scene.versions.length-1];
  const scenes=v.scenes.map(s=>`<div style="margin-bottom:10px">
      <label>Page/scene ${esc(s.scene)} — transcript (edit to fix misreads)</label>
      <textarea rows="3" data-scene="${esc(s.scene)}">${esc(s.text)}</textarea></div>`).join("");
  const items=v.items.map(it=>`<tr>
      <td class="mono">${esc(it.item_id)}</td>
      <td><input type="text" data-item="${esc(it.item_id)}" value="${esc(it.text_span)}"></td>
      <td>${esc((it.type||"").replace(/_/g," "))}</td>
      <td style="text-align:center"><input type="checkbox" data-lock="${esc(it.text_span)}" title="Lock this exact text"></td>
    </tr>`).join("");
  el("view").innerHTML=`<div class="card">
    <h1>Confirm what we read</h1>
    <p class="lede">Check that we read this correctly before researching it. Visual references
      are candidates — we do not infer identity, ownership, or likeness from a drawing.</p>
    ${v.scenes.some(s=>!s.text)?'<div class="banner warn">Image pages: add or correct the transcript below so research targets the right text.</div>':""}
    ${scenes}
    <h2 style="margin-top:16px">Candidate references &amp; claims</h2>
    <table><thead><tr><th>ID</th><th>Text</th><th>Type</th><th>Lock exact text</th></tr></thead><tbody>${items}</tbody></table>
    <div style="margin-top:14px">
      <label for="instr2">Instruction</label>
      <textarea id="instr2" rows="2">${esc(S.scene.instruction||"")}</textarea>
    </div>
    <p class="hint">Editing confirmed text creates a new version and invalidates dependent findings.</p>
    <div class="row" style="margin-top:8px">
      <button id="confirmBtn">${S.busy?'<span class="spin"></span> Researching…':'Confirm and research'}</button>
      <button class="ghost" id="backBtn">Back</button>
    </div>
    ${S.error?`<div class="err">${esc(S.error)}</div>`:""}
  </div>`;
  el("backBtn").onclick=()=>{S.view="analyze";render()};
  el("confirmBtn").onclick=confirmAndResearch;
}
async function confirmAndResearch(){
  S.error="";
  const v=S.scene.versions[S.scene.versions.length-1];
  const scenes=[...document.querySelectorAll("[data-scene]")].map(t=>({
    scene:isNaN(+t.dataset.scene)?t.dataset.scene:+t.dataset.scene, text:t.value,
    source:S.scene.source_type==="images"?"image":"paste"}));
  const inputs={};
  document.querySelectorAll("[data-item]").forEach(i=>inputs[i.dataset.item]=i.value);
  const items=v.items.map(it=>Object.assign({},it,
    {text_span:inputs[it.item_id]!=null?inputs[it.item_id]:it.text_span}));
  const locks=[...document.querySelectorAll("[data-lock]:checked")].map(c=>c.dataset.lock);
  const instruction=(el("instr2").value||"").trim();
  S.busy=true; renderConfirm();
  try{
    await api(`/scenes/${S.scene.scene_id}`,{method:"PATCH",body:JSON.stringify(
      {expected_version:S.scene.current_version,scenes,items,instruction,locks})});
    S.run=await api("/runs",{method:"POST",body:JSON.stringify(
      {scene_id:S.scene.scene_id,mode:S.runMode})});
    S.scene=await refreshScene();
    S.sel=firstFinding(); S.busy=false; S.view="desk"; render();
  }catch(e){ S.busy=false; S.error=String(e.message||e); renderConfirm(); }
}
async function refreshScene(){ // re-read scene so current_version is fresh
  try{ return await api("/scenes/"+S.scene.scene_id).catch(()=>S.scene); }catch(e){ return S.scene; }
}

/* ---------------- Scene desk (sol_ui.md §6) ---------------- */
function firstFinding(){
  const f=(S.run.findings||[]).slice().sort((a,b)=>RANK[a.research_status]-RANK[b.research_status])[0];
  return f?f.finding_id:null;
}
function findingById(id){return (S.run.findings||[]).find(f=>f.finding_id===id)}
function viewDesk(){
  const fs=(S.run.findings||[]).slice().sort((a,b)=>RANK[a.research_status]-RANK[b.research_status]);
  const rows=fs.map(f=>`<div class="frow ${f.finding_id===S.sel?"sel":""}" data-f="${esc(f.finding_id)}">
      <div class="claim">${esc(f.text_span)}</div>
      <div class="loc">page/scene ${esc(f.scene)} · <span class="status s-${f.research_status}">${esc(STATUS_LABEL[f.research_status]||f.research_status)}</span>
      ${f.routing&&f.routing!=="NONE"?" · "+esc(ROUTE_LABEL[f.routing]):""}</div>
    </div>`).join("");
  return `<div class="card">${S.run.stale?'<div class="banner warn">Scene v'+S.scene.current_version+' saved. Recheck needed. <button class="ghost" id="recheckBtn">Run recheck</button></div>':""}
    ${S.error?`<div class="err">${esc(S.error)}</div>`:""}
    <div class="desk">
      <div class="src">
        <h2>Findings</h2>
        ${rows||'<p class="hint">No findings.</p>'}
      </div>
      <div class="inv" id="inv">${paneFinding()}</div>
    </div></div>`;
}
function paneFinding(){
  const f=findingById(S.sel);
  if(!f)return '<p class="hint">Select a finding.</p>';
  const byId={}; (S.run.sources||[]).forEach(s=>byId[s.source_id]=s);
  const ev=(f.evidence||[]).map(a=>{
    const src=byId[a.source_id]||{};
    const rel=a.relation||"unclear";
    return `<div class="passage ${rel}">
      <div class="rel">${esc(rel==="context_only"?"Context only":rel)}</div>
      <div>“${esc(a.passage||"")}”</div>
      <div class="meta">${esc(src.title||domainOf(src.url))} · ${esc(domainOf(src.url))} · retrieved ${esc(fmt(src.retrieved_at))}
        ${src.url?` · <a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer">view source</a>`:""}</div>
    </div>`;
  }).join("") || '<p class="hint">No applicable evidence retrieved for this claim.</p>';
  const canRevise=["CONTRADICTED","MIXED"].includes(f.research_status);
  const proposalBlock = (S.proposal&&S.proposal.finding_id===f.finding_id)?renderProposal():"";
  return `<div class="kv">Claim</div>
    <div class="scenebox" style="max-height:none">${esc(f.text_span)}</div>
    <div class="kv" style="margin-top:10px">Research question</div>
    <div class="hint mono">${esc(f.query)}</div>
    <div class="kv" style="margin-top:10px">Status: <b class="status s-${f.research_status}">${esc(STATUS_LABEL[f.research_status]||f.research_status)}</b>
      ${f.routing&&f.routing!=="NONE"?`· <b>${esc(ROUTE_LABEL[f.routing])}</b> <span class="hint">(records a note; does not send a message)</span>`:""}</div>
    <h2 style="margin-top:14px">Evidence</h2>
    ${ev}
    <div class="row" style="margin-top:14px">
      ${canRevise?`<button id="proposeBtn">${S.busy?'<span class="spin"></span> Proposing…':'Propose a small revision'}</button>`
        :`<button class="ghost" disabled>Propose a small revision</button>`}
      <button class="ghost" data-keep="1">Keep as written</button>
    </div>
    ${f.human_decision?`<p class="hint ok">Recorded: ${esc(f.human_decision.action)} as written${f.human_decision.note?' — "'+esc(f.human_decision.note)+'"':''}. This does not change the factual assessment.</p>`:""}
    ${canRevise?"":'<p class="hint">We need applicable evidence before proposing a factual correction.</p>'}
    ${proposalBlock}`;
}
function wordDiff(a,b){
  const aw=a.split(/(\s+)/), bw=b.split(/(\s+)/);
  // simple LCS-free token diff: mark trailing/leading equal run
  let i=0; while(i<aw.length&&i<bw.length&&aw[i]===bw[i])i++;
  let j=0; while(j<aw.length-i&&j<bw.length-i&&aw[aw.length-1-j]===bw[bw.length-1-j])j++;
  const same1=aw.slice(0,i).join(""), delMid=aw.slice(i,aw.length-j).join(""),
        insMid=bw.slice(i,bw.length-j).join(""), same2=aw.slice(aw.length-j).join("");
  return esc(same1)+(delMid?`<del>${esc(delMid)}</del>`:"")+(insMid?`<ins>${esc(insMid)}</ins>`:"")+esc(same2);
}
function renderProposal(){
  const p=S.proposal;
  if(p.status==="conflict")
    return `<div class="banner warn">This correction would change protected text
      (<span class="mono">${esc(p.conflict_span)}</span>). Change the lock or request another proposal.</div>`;
  return `<div class="card" style="margin-top:14px;background:#fbfaf7">
    <h2>Proposed revision</h2>
    <div class="diff">${wordDiff(p.original_text,p.proposed_text)}</div>
    <div class="kv"><b>Why this change:</b> ${esc(p.rationale)}</div>
    <div class="kv"><b>Evidence:</b> ${esc((p.evidence_source_ids||[]).join(", ")||"—")}</div>
    ${p.art_change?`<div class="banner warn">Art change still needed (text accepted; artwork not modified): ${esc(p.art_change)}</div>`:""}
    <div class="row" style="margin-top:8px">
      <button id="acceptBtn">${S.busy?'<span class="spin"></span> Saving…':'Accept text revision'}</button>
      <button class="ghost" id="rejectBtn">Reject proposal</button>
    </div>
  </div>`;
}
function wireDesk(){
  document.querySelectorAll("[data-f]").forEach(r=>r.onclick=()=>{S.sel=r.dataset.f;S.proposal=null;render()});
  const pb=el("proposeBtn"); if(pb) pb.onclick=propose;
  const ab=el("acceptBtn"); if(ab) ab.onclick=accept;
  const rb=el("rejectBtn"); if(rb) rb.onclick=reject;
  const rc=el("recheckBtn"); if(rc) rc.onclick=doRecheck;
  document.querySelectorAll("[data-keep]").forEach(b=>b.onclick=()=>keepAsWritten());
}
async function propose(){
  S.error=""; S.busy=true; render();
  try{
    S.proposal=await api(`/runs/${S.run.run_id}/revisions`,{method:"POST",body:JSON.stringify({finding_id:S.sel})});
    S.busy=false; render();
  }catch(e){ S.busy=false; S.error=String(e.message||e); render(); }
}
async function accept(){
  S.busy=true; render();
  try{
    await api(`/revisions/${S.proposal.revision_id}/decision`,{method:"POST",body:JSON.stringify(
      {run_id:S.run.run_id,action:"accept",expected_version:S.scene.current_version,
       idempotency_key:S.proposal.revision_id})});
    S.scene=await refreshScene();
    S.run.stale=true; S.proposal=null; S.busy=false; render();
  }catch(e){ S.busy=false; S.error=String(e.message||e); render(); }
}
async function reject(){
  try{ await api(`/revisions/${S.proposal.revision_id}/decision`,{method:"POST",
    body:JSON.stringify({run_id:S.run.run_id,action:"reject"})}); }catch(e){}
  S.proposal=null; render();
}
async function doRecheck(){
  S.busy=true; render();
  try{
    S.run=await api(`/scenes/${S.scene.scene_id}/recheck`,{method:"POST",body:JSON.stringify({run_id:S.run.run_id})});
    S.sel=firstFinding(); S.busy=false; render();
  }catch(e){ S.busy=false; S.error=String(e.message||e); render(); }
}
async function keepAsWritten(){
  const it=findingById(S.sel); if(!it) return;
  try{
    const res=await api(`/runs/${S.run.run_id}/findings/${S.sel}/decision`,
      {method:"POST",body:JSON.stringify({action:"keep",note:""})});
    it.human_decision=res.human_decision;   // show "Recorded" only after the server saves it
    render();
  }catch(e){ S.error=String(e.message||e); render(); }
}

/* ---------------- Handoff (sol_ui.md §10) — renders ONE server snapshot ---------------- */
function viewHandoff(){
  const h=S.handoff;
  if(!h) return `<div class="card"><p class="hint">Loading handoff…</p></div>`;
  const srcKey=s=>esc(s.origin_run_id)+" · "+esc(s.source_id);
  const changes=(h.accepted_changes||[]).map(c=>`<tr><td class="mono">${esc(c.item_id)}</td>
    <td><del>${esc(c.original_text)}</del><br><ins>${esc(c.proposed_text)}</ins></td>
    <td>${esc(c.rationale)}<br><span class="hint mono">${(c.evidence||[]).map(r=>esc(r.origin_run_id)+"/"+esc(r.source_id)).join(", ")}</span></td></tr>`).join("")
    ||'<tr><td colspan="3" class="hint">No accepted revisions — research draft.</td></tr>';
  const openRows=(h.unresolved||[]).map(u=>`<tr><td>${esc(u.claim)}</td><td class="status s-${u.research_status}">${esc(STATUS_LABEL[u.research_status]||u.research_status)}</td></tr>`).join("")||'<tr><td colspan="2" class="hint">None.</td></tr>';
  const srcRows=(h.sources||[]).map(s=>`<tr><td class="mono">${srcKey(s)}</td><td>${esc(s.title||domainOf(s.url))}</td><td>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(domainOf(s.url))}</a>`:""}</td><td>${esc(fmt(s.retrieved_at))}</td></tr>`).join("");
  const unresolvedRefs = h.references_resolved===false
    ? `<div class="banner warn">Some cited evidence could not be resolved; this handoff is an incomplete draft.</div>` : "";
  return `<div class="card">
    <h1>${esc(h.label)}</h1>
    <div class="hint noprint">${esc(h.title)} · scene v${esc(h.scene.current_version)} · instruction: ${esc(h.instruction||"")} · handoff ${esc(h.run_id||"")}</div>
    ${unresolvedRefs}
    <div class="row noprint" style="margin:10px 0">
      <button id="dlText">Download scene text</button>
      <button class="ghost" onclick="window.print()">Print / Save PDF</button>
      <button class="ghost" id="dlJson">Download research JSON</button>
      <button class="ghost" id="delNow" style="border-color:var(--contradicted);color:var(--contradicted)">Delete now</button>
    </div>
    <p class="hint noprint">Expires ${esc(fmtExpiry(h.expires_at))}. <b>Download your handoff before it expires</b> — downloaded files stay with you, outside StudioClear's automated cleanup.${h.simulated?' This is a <b>Simulated example</b>.':''}</p>
    <h2>Accepted scene text</h2>
    <div class="scenebox" style="max-height:none">${esc(h.scene.accepted_text)}</div>
    <h2 style="margin-top:16px">Accepted changes</h2>
    <table><thead><tr><th>Claim</th><th>Original → proposed</th><th>Why · evidence (run/source)</th></tr></thead><tbody>${changes}</tbody></table>
    <h2 style="margin-top:16px">Unresolved &amp; remaining work</h2>
    <table><thead><tr><th>Claim</th><th>Status</th></tr></thead><tbody>${openRows}</tbody></table>
    <h2 style="margin-top:16px">Source index</h2>
    <table><thead><tr><th>Origin run / ID</th><th>Title</th><th>Link</th><th>Retrieved</th></tr></thead><tbody>${srcRows}</tbody></table>
    <p class="hint" style="margin-top:16px">Run mode: ${esc(h.provider_mode)} · research policy ${esc(h.policy_version||"")}.
      Text changes only; any noted art changes are pending and not visually verified.</p>
  </div>`;
}
function wireHandoff(){
  const h=S.handoff; if(!h) return;
  const dl=(name,content,type)=>{const b=new Blob([content],{type});const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)};
  // TXT and JSON both derive from the SAME server snapshot the screen rendered.
  el("dlText").onclick=()=>dl("scene_v"+h.scene.current_version+".txt",h.scene.accepted_text,"text/plain");
  el("dlJson").onclick=()=>dl("handoff_"+(h.run_id||"")+".json",JSON.stringify(h,null,2),"application/json");
  el("delNow").onclick=async()=>{
    try{ await api("/scenes/"+S.scene.scene_id,{method:"DELETE"}); S.expired=true; renderExpired(); }
    catch(e){ S.error=String(e.message||e); render(); }
  };
}

/* ---------------- Execution (sol_ui.md §11) ---------------- */
function viewExec(){
  const a=S.run.audit_chain||[]; const g=S.run.governance||{};
  const rows=a.map((e,i)=>{const b=e.body||{};const isSelf=b.self_test;
    return `<tr><td class="mono">#${String(i+1).padStart(3,"0")}</td><td>${esc(b.action||"")}</td>
      <td>${esc(b.item_id||b.batch||b.tool||"")}${b.status?" · "+esc(b.status):""}${b.decision?" · "+esc(b.decision):""}${isSelf?' · <b>self-test</b>':""}</td>
      <td class="mono">${esc((e.hash||"").slice(0,10))}</td></tr>`}).join("");
  return `<div class="card">
    <h1>Execution</h1>
    <p class="lede">What actually ran for this run. Provider mode is recorded per run,
      not inferred from a health check.</p>
    <div class="kv"><b>Provider mode:</b> ${esc(S.run.provider_mode)} ${S.run.provider_mode==="live"?'<span class="badge live">live</span>':'<span class="badge sim">simulated</span>'}</div>
    <div class="kv"><b>Findings:</b> ${(S.run.findings||[]).length} · <b>Sources:</b> ${(S.run.sources||[]).length}</div>
    <h2 style="margin-top:14px">Access controls</h2>
    <div class="kv">Authorization self-test: unapproved tool denied at the tool boundary
      = <b>${g.self_test_denied?"denied ✓":"—"}</b> <span class="hint">(a deliberate self-test, excluded from incident counts)</span></div>
    <div class="kv">Operational unauthorized attempts: <b>${g.unauthorized_blocked||0}</b></div>
    <h2 style="margin-top:14px">Audit</h2>
    <div class="kv">${a.length} events · <b>${g.audit_verified?"Chain consistency verified":"chain inconsistent"}</b>
      <details style="display:inline"><summary>what this means</summary>
      <span class="hint">A local hash chain detects edits within this record. It is not a claim of tamper-proof or immutable storage.</span></details></div>
    <table><thead><tr><th>#</th><th>Action</th><th>Detail</th><th>Hash</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function wire(){
  if(S.view==="analyze")wireAnalyze();
  else if(S.view==="confirm")return; // handled in renderConfirm
  else if(S.view==="desk")wireDesk();
  else if(S.view==="handoff")wireHandoff();
}
render();
</script>
