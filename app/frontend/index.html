<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StudioClear — Script clearance research desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* claude_ui.md — the clearance binder on a production coordinator's desk.
     Color is reserved for STATE (verdicts, allow/deny). The verdict stamp is the
     one memorable object; everything else is script pages, rules, and a sources log. */
  :root {
    --paper:#F3F4F1; --panel:#FBFBFA; --ink:#1C2331; --rule:#BFC4BD;
    --dim:#5b6472; --clear:#2F7A4F; --review:#A8780A; --escalate:#B23A2E; --insuf:#6B5B95;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --script:"Courier Prime","Courier New",monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:400 15px/1.55 var(--sans); background:var(--paper); color:var(--ink); }
  a { color:var(--ink); }
  .mono { font-family:var(--script); }

  header { padding:16px 26px 0; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .brand { font-weight:600; font-size:19px; }
  .brand .s { color:var(--dim); font-weight:400; font-size:13px; display:block; margin-top:1px; }
  .runmeta { text-align:right; color:var(--dim); font-size:13px; }
  .runmeta b { color:var(--ink); }
  .toolbar { display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin:14px 0 0; }
  button { font:600 13.5px var(--sans); background:var(--ink); color:#fff; border:0;
           padding:9px 15px; border-radius:6px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--rule); }
  button.ghost:hover { background:rgba(28,35,49,.05); filter:none; }
  button:disabled { opacity:.45; cursor:default; }
  label.chk { color:var(--dim); font-size:13px; display:flex; gap:6px; align-items:center; }

  /* tabs */
  .tabs { display:flex; gap:2px; margin:16px 0 0; border-bottom:1px solid var(--rule); }
  .tab { padding:10px 18px; cursor:pointer; color:var(--dim); font-weight:600; font-size:14px;
         border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active { color:var(--ink); border-bottom-color:var(--ink); }

  main { max-width:1180px; margin:0 auto; padding:0 26px 80px; }

  /* status strip */
  .strip { display:flex; gap:22px; flex-wrap:wrap; padding:16px 0; border-bottom:1px solid var(--rule); font-size:13.5px; }
  .strip .chip { cursor:pointer; color:var(--ink); }
  .strip .chip .k { color:var(--dim); }
  .strip .ok { color:var(--clear); font-weight:600; }
  .strip .deny { color:var(--escalate); font-weight:600; }
  .strip .wait { margin-left:auto; font-weight:600; }
  .strip .wait b { font-size:16px; }

  /* two-pane desk */
  .desk { display:grid; grid-template-columns:minmax(340px,1fr) 1.3fr; gap:0; }
  @media (max-width:820px){ .desk{ grid-template-columns:1fr; } }
  .queue { border-right:1px solid var(--rule); padding:18px 20px 18px 0; }
  @media (max-width:820px){ .queue{ border-right:0; border-bottom:1px solid var(--rule); padding-right:0; } }
  .qh { font-weight:600; font-size:13px; color:var(--dim); margin:0 0 8px; }
  .qrow { display:flex; align-items:center; gap:10px; padding:11px 10px; border-radius:6px; cursor:pointer; border:1px solid transparent; }
  .qrow:hover { background:#fff; }
  .qrow.sel { background:#fff; border-color:var(--rule); }
  .qrow .id { font-family:var(--script); font-weight:700; font-size:13px; min-width:64px; }
  .qrow .ty { flex:1; color:var(--dim); font-size:13px; }
  .qrow .sc { color:var(--dim); font-size:12px; font-family:var(--script); }
  .cleared { margin-top:14px; }
  .cleared summary { cursor:pointer; color:var(--dim); font-size:13px; font-weight:600; }
  .cleared .qrow .id { color:var(--dim); }

  .pane { padding:18px 4px 18px 26px; }
  @media (max-width:820px){ .pane{ padding-left:0; } }
  .pane .eyebrow { color:var(--dim); font-size:12px; font-weight:600; }
  .pane h2 { margin:2px 0 14px; font-size:20px; }
  .quote { border-left:3px solid var(--ink); padding:6px 0 6px 14px; margin:0 0 18px;
           font-family:var(--script); font-size:14px; line-height:1.6; }
  .block { margin:0 0 20px; }
  .block .lbl { font-size:12px; font-weight:600; color:var(--dim); margin-bottom:7px; }
  .rule-line { font-size:13.5px; color:var(--dim); margin-top:8px; }
  .rule-line .rid { font-family:var(--script); color:var(--ink); cursor:pointer; border-bottom:1px dashed var(--rule); }

  /* evidence sources */
  .src { display:flex; gap:12px; padding:11px 0; border-top:1px solid var(--rule); }
  .src .n { font-family:var(--script); font-weight:700; color:var(--dim); }
  .src .title { font-weight:600; }
  .src .title a { text-decoration:none; }
  .src .title a:hover { text-decoration:underline; }
  .src .ex { color:var(--dim); font-size:13px; margin:3px 0; }
  .src .meta { color:var(--dim); font-size:12px; font-family:var(--script); }
  .via { color:var(--dim); font-size:12.5px; margin-bottom:2px; }
  .insuff { color:var(--dim); font-size:13.5px; }

  .actions { display:flex; gap:9px; flex-wrap:wrap; margin-top:6px; }
  .recorded { margin-top:12px; font-size:13px; color:var(--clear); font-family:var(--script); }
  .ovr { margin-top:10px; }
  .ovr textarea { width:100%; font:14px var(--sans); padding:9px; border:1px solid var(--rule); border-radius:6px; resize:vertical; background:#fff; color:var(--ink); }

  /* verdict stamp — the one memorable object */
  .stamp { display:inline-block; font:700 12px var(--script); letter-spacing:1.5px; text-transform:uppercase;
           border:1.5px solid currentColor; border-radius:3px; padding:3px 9px; transform:rotate(-1.5deg); white-space:nowrap; }
  .stamp.CLEAR,.CLEAR{color:var(--clear)} .stamp.REVIEW,.REVIEW{color:var(--review)}
  .stamp.ESCALATE,.ESCALATE{color:var(--escalate)} .stamp.INSUFFICIENT_EVIDENCE,.INSUFFICIENT_EVIDENCE{color:var(--insuf)}
  .stamp.big { font-size:15px; padding:6px 14px; letter-spacing:2px; }

  /* run view */
  .run { display:grid; grid-template-columns:1.15fr 1fr; gap:0; padding-top:18px; }
  @media (max-width:820px){ .run{ grid-template-columns:1fr; } }
  .exec { border-right:1px solid var(--rule); padding-right:24px; }
  @media (max-width:820px){ .exec{ border-right:0; } }
  .auth { padding-left:26px; }
  @media (max-width:820px){ .auth{ padding-left:0; margin-top:20px; } }
  .colh { font-weight:600; font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; margin:0 0 14px; }
  .node { padding:10px 0; border-bottom:1px solid var(--rule); }
  .node .nl { display:flex; align-items:baseline; gap:9px; }
  .node .nm { font-weight:600; }
  .node .ck { color:var(--clear); font-weight:700; } .node .pend { color:var(--review); font-weight:700; }
  .node .det { color:var(--dim); font-size:13px; margin-top:3px; }
  .node .sub { color:var(--dim); font-size:13px; margin-top:2px; padding-left:2px; font-family:var(--script); }
  .allow { color:var(--clear); font-family:var(--script); font-size:13px; }
  .deny { color:var(--escalate); font-family:var(--script); font-size:13px; }
  .authblk { margin:0 0 20px; }
  .authblk .h { font-weight:600; font-size:13px; margin-bottom:6px; }
  .authblk .row { font-family:var(--script); font-size:13px; color:var(--ink); }
  .authblk .no { color:var(--escalate); } .authblk .yes { color:var(--clear); }
  .authblk .mut { color:var(--dim); }

  .auditbox { margin-top:22px; border-top:1px solid var(--rule); padding-top:14px; }
  .auditbox .hd { display:flex; justify-content:space-between; align-items:center; }
  .auditbox .hd h3 { margin:0; font-size:14px; }
  table.audit { width:100%; border-collapse:collapse; margin-top:10px; }
  table.audit td { padding:5px 8px; border-bottom:1px solid var(--rule); font:13px var(--script); vertical-align:top; }
  table.audit td.seq { color:var(--dim); } table.audit td.h { color:var(--dim); }
  table.audit tr.deny td { color:var(--escalate); }
  pre.raw { background:#fff; border:1px solid var(--rule); border-radius:6px; padding:12px; overflow:auto; font-size:12px; max-height:360px; }

  /* report */
  .report { padding-top:22px; max-width:820px; }
  .report h1 { font-size:22px; margin:0 0 2px; }
  .report .rsub { color:var(--dim); font-size:13.5px; margin-bottom:20px; }
  .totals { width:100%; border-collapse:collapse; margin-bottom:8px; }
  .totals td { padding:5px 0; font-size:14px; } .totals td.v { text-align:right; font-weight:600; font-family:var(--script); }
  .ritem { border-top:1px solid var(--rule); padding:16px 0; }
  .ritem .rh { display:flex; justify-content:space-between; align-items:baseline; }
  .ritem .rid { font-family:var(--script); font-weight:700; }
  .ritem .rt { color:var(--dim); font-size:13px; }
  .ritem .rl { color:var(--dim); font-size:13px; margin-top:6px; }
  .ritem .rl b { color:var(--ink); font-weight:600; }
  .foot { margin-top:26px; padding-top:14px; border-top:1px solid var(--rule); color:var(--dim); font-style:italic; }

  .empty { padding:60px 0; text-align:center; color:var(--dim); }
  @media print {
    header, .tabs, .strip, .toolbar { display:none !important; }
    #viewDesk, #viewRun { display:none !important; }
    body { background:#fff; } main { max-width:none; }
    .report { padding-top:0; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">StudioClear<span class="s">Script clearance research desk</span></div>
    <div class="runmeta" id="runmeta"></div>
  </div>
  <div class="toolbar">
    <button id="loadDemo">Load demo run</button>
    <button class="ghost" id="runLive">Run live</button>
    <label class="chk"><input type="checkbox" id="adk" /> via ADK agent</label>
    <span class="mono" id="status" style="color:var(--dim);font-size:12.5px"></span>
  </div>
  <div class="tabs">
    <div class="tab active" data-view="desk">Decision desk</div>
    <div class="tab" data-view="run">Run</div>
    <div class="tab" data-view="report">Report</div>
  </div>
</header>
<main>
  <div id="viewDesk"></div>
  <div id="viewRun" hidden></div>
  <div id="viewReport" hidden></div>
</main>

<script>
let RUN=null, POLICY=null, HEALTH=null, PROVIDERS=null, VIEW='desk', SEL=null, RAW=false, OVR=false;
const $ = s => document.querySelector(s);
const api = (p,opts) => fetch(p,opts).then(r=>r.json());

(async()=>{ try{ HEALTH=await api('/health'); }catch(e){} loadDemo(); })();

$('#loadDemo').onclick = loadDemo;
$('#runLive').onclick = () => go(true, $('#adk').checked);
document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchView(t.dataset.view));

function loadDemo(){ go(false,false); }

async function go(live, adk){
  $('#loadDemo').disabled = $('#runLive').disabled = true;
  $('#status').textContent = adk ? 'Running agentic pipeline (live, ~75s)…'
    : live ? 'Running live pipeline (real Parallel calls, ~40s)…' : 'Loading demo run…';
  try{
    const res = await api('/upload',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prefer_live:live, use_adk:adk, title:'Midnight Signal'})});
    PROVIDERS = res.providers;
    RUN = await api('/run/'+res.run_id);
    SEL = firstQueueId(); OVR=false;
    $('#status').textContent = '';
    render();
  }catch(e){ $('#status').textContent = 'Error: '+e; }
  $('#loadDemo').disabled = $('#runLive').disabled = false;
}

// --- helpers ---
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function domainOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u||''; } }
function fmtTime(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return iso;
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'UTC'})+' UTC'; }
function needsDecision(it){ return it.state!=='CLEAR' && !it.human_decision; }
function firstQueueId(){ const q=(RUN.items||[]).filter(needsDecision); return q.length?q[0].item_id:(RUN.items[0]&&RUN.items[0].item_id); }
function itemById(id){ return (RUN.items||[]).find(i=>i.item_id===id); }
function batchOf(id){ const b=(RUN.batches||[]).find(b=>(b.items||[]).includes(id)); return b?b.name:''; }
function totalSources(){ return (RUN.items||[]).reduce((a,i)=>a+(i.source_count||0),0); }
function humanReason(r){ return (r||'').replace(/_/g,' '); }
function stamp(state,big){ return `<span class="stamp ${state}${big?' big':''}">${esc(state.replace('_',' '))}</span>`; }

function switchView(v){ VIEW=v; RAW=false;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  render(); }

function render(){
  if(!RUN){ return; }
  renderRunMeta();
  $('#viewDesk').hidden = VIEW!=='desk';
  $('#viewRun').hidden  = VIEW!=='run';
  $('#viewReport').hidden = VIEW!=='report';
  if(VIEW==='desk') renderDesk();
  else if(VIEW==='run') renderRun();
  else renderReport();
}

function renderRunMeta(){
  const g=RUN.governance||{};
  $('#runmeta').innerHTML = `<b>${esc(RUN.title)}</b> · v1<br>Run ${esc((RUN.run_id||'').replace('run_',''))} · completed ${esc(fmtTime(RUN.generated_at))}`;
}

// ---------------- Decision desk ----------------
function renderDesk(){
  const items=RUN.items||[], m=RUN.metrics||{}, g=RUN.governance||{}, s=RUN.summary||{};
  const queue=items.filter(needsDecision);
  const done=items.filter(i=>!needsDecision(i));
  const strip = `<div class="strip">
    <span class="chip" data-goto="run"><span class="ok">✓</span> Analyzer <b>${m.references_detected||0}</b> <span class="k">items</span></span>
    <span class="chip" data-goto="run"><span class="ok">✓</span> Planner <b>${(RUN.batches||[]).length}</b> <span class="k">batches</span></span>
    <span class="chip" data-goto="run"><span class="ok">✓</span> Parallel <b>${totalSources()}</b> <span class="k">sources</span></span>
    <span class="chip" data-goto="run"><span class="ok">✓</span> Policy <b>${m.references_detected||0}</b> <span class="k">evaluated</span></span>
    <span class="chip" data-goto="run"><span class="deny">✕</span> Authorization <span class="k">·</span> ${g.unauthorized_blocked||0} denied</span>
    <span class="wait">Waiting on you: <b>${queue.length}</b></span>
  </div>`;

  const qrow = it => `<div class="qrow ${it.item_id===SEL?'sel':''}" data-id="${esc(it.item_id)}">
      <span class="id">${esc(it.item_id)}</span>
      <span class="ty">${esc(it.type.replace(/_/g,' '))} <span class="sc">sc.${esc(String(it.scene))}</span></span>
      ${stamp(it.state)}</div>`;

  const clearedRows = done.map(qrow).join('') || '<div class="qh" style="margin-top:8px">None yet.</div>';
  const deskHtml = `${strip}
    <div class="desk">
      <div class="queue">
        <p class="qh">Items needing your decision (${queue.length})</p>
        ${queue.map(qrow).join('') || '<div class="empty" style="padding:24px 0">Nothing waiting — every item is cleared or decided.</div>'}
        <details class="cleared" ${queue.length?'':'open'}>
          <summary>Resolved &amp; cleared (${done.length})</summary>
          ${clearedRows}
        </details>
      </div>
      <div class="pane" id="pane"></div>
    </div>`;
  $('#viewDesk').innerHTML = deskHtml;
  document.querySelectorAll('.strip .chip').forEach(c=>c.onclick=()=>switchView('run'));
  document.querySelectorAll('.qrow').forEach(r=>r.onclick=()=>{ SEL=r.dataset.id; OVR=false; renderDesk(); });
  renderPane();
}

function renderPane(){
  const it=itemById(SEL);
  const pane=$('#pane'); if(!pane) return;
  if(!it){ pane.innerHTML='<div class="empty">Select an item.</div>'; return; }
  const ev=it.evidence||[];
  const evHtml = ev.length ? ev.map((e,i)=>`
      <div class="src"><span class="n">${i+1}</span><div>
        <div class="title"><a href="${esc(e.source_url)}" target="_blank" rel="noopener">${esc(e.title||e.source_url)}</a></div>
        ${e.excerpt?`<div class="ex">${esc(e.excerpt)}</div>`:''}
        <div class="meta">${esc(domainOf(e.source_url))} · retrieved ${esc(fmtTime(e.retrieved_at))}</div>
      </div></div>`).join('')
    : `<div class="insuff">Insufficient evidence — no authoritative source met the policy bar.<br>
        <span class="mono" style="font-size:12.5px">Searched: ${esc(it.query)}</span></div>`;
  const rec = it.human_decision
    ? `${stamp(it.state,true)} <span class="rule-line">recommended</span>`
    : stamp(it.state,true);
  const recorded = it.human_decision
    ? `<div class="recorded">Recorded · ${esc(it.human_decision.action.replace(/_/g,' '))}${it.human_decision.reason?' · "'+esc(it.human_decision.reason)+'"':''} · audit #${RUN.governance.audit_events}</div>`
    : '';
  pane.innerHTML = `
    <div class="eyebrow">${esc(it.type.replace(/_/g,' '))} · scene ${esc(String(it.scene))}</div>
    <h2 class="mono">${esc(it.item_id)}</h2>
    <div class="quote">${esc(it.text_span)}</div>
    <div class="block">
      <div class="lbl">Recommendation</div>
      ${rec}
      <div class="rule-line">rule <span class="rid" data-rid="${esc(it.policy_key)}">${esc(it.policy_key)}</span> → ${esc(humanReason(it.reason))}</div>
    </div>
    <div class="block">
      <div class="lbl">Evidence — ${ev.length} source${ev.length===1?'':'s'}</div>
      <div class="via">via Parallel Search${batchOf(it.item_id)?' · batch '+esc(batchOf(it.item_id)):''}</div>
      ${evHtml}
    </div>
    <div class="block">
      <div class="lbl">Your decision</div>
      <div class="actions">
        <button data-act="clear">Clear to continue</button>
        <button class="ghost" data-act="escalate">Send to legal</button>
        <button class="ghost" id="ovrBtn">Override recommendation…</button>
      </div>
      <div class="ovr" id="ovrBox" ${OVR?'':'hidden'}>
        <textarea id="ovrReason" rows="2" placeholder="Reason for overriding the recommendation (required)"></textarea>
        <div class="actions" style="margin-top:8px"><button id="ovrConfirm" disabled>Record override</button></div>
      </div>
      ${recorded}
    </div>`;
  pane.querySelectorAll('.rid').forEach(r=>r.onclick=()=>openPolicy(r.dataset.rid));
  pane.querySelector('[data-act="clear"]').onclick=()=>decide(it.item_id,'clear');
  pane.querySelector('[data-act="escalate"]').onclick=()=>decide(it.item_id,'escalate');
  pane.querySelector('#ovrBtn').onclick=()=>{ OVR=!OVR; renderPane(); };
  if(OVR){
    const ta=pane.querySelector('#ovrReason'), btn=pane.querySelector('#ovrConfirm');
    ta.focus(); ta.oninput=()=>btn.disabled=!ta.value.trim();
    btn.onclick=()=>decide(it.item_id,'override',ta.value.trim());
  }
}

async function decide(item_id, action, reason=''){
  await api('/decision',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({run_id:RUN.run_id, item_id, action, reason})});
  RUN = await api('/run/'+RUN.run_id);
  OVR=false; render();
}

// ---------------- Run view ----------------
function renderRun(){
  const a=RUN.audit_chain||[], g=RUN.governance||{}, m=RUN.metrics||{}, s=RUN.summary||{};
  const agents=RUN.agents||[], iam=RUN.iam_checks||[];
  const model = (agents.find(x=>x.name==='research_planner')||{}).model||'';
  const denyIdx = a.findIndex(e=>e.body&&e.body.decision==='DENY');
  const deny = denyIdx>=0 ? a[denyIdx].body : null;
  const decided=(RUN.items||[]).filter(i=>i.human_decision).length;
  const waiting=(RUN.items||[]).filter(needsDecision).length;
  const batchLines=(RUN.batches||[]).map(b=>`<div class="sub">${esc(b.name)} · ${(b.items||[]).length} items</div>`).join('');

  const exec = `<div class="exec">
    <p class="colh">Execution</p>
    ${node('Script upload','✓',esc(RUN.script_id||''))}
    ${node('Script analyzer','✓',`${m.references_detected||0} items · Gemini ${esc(model)}`)}
    ${node('Research planner','✓',`${(RUN.batches||[]).length} batches`,batchLines)}
    <div class="node"><div class="nl"><span class="nm">Authorization gate</span></div>
      <div class="allow">✓ parallel.search.public_web · ALLOW</div>
      ${deny?`<div class="deny">✕ ${esc(deny.tool)} · DENY · ${esc(deny.reason)}</div>`:''}</div>
    ${node('Parallel Search','✓',`searched ${m.references_detected||0} items · ${totalSources()} sources · ${m.evidence_backed||0}/${m.references_detected||0} evidence-backed`)}
    ${node('Reviewer / policy','✓',`${s.CLEAR||0} clear · ${s.REVIEW||0} review · ${s.ESCALATE||0} escalate${s.INSUFFICIENT_EVIDENCE?' · '+s.INSUFFICIENT_EVIDENCE+' insufficient':''}`)}
    <div class="node"><div class="nl"><span class="pend">●</span><span class="nm">Human decisions</span></div>
      <div class="det">${decided} recorded · ${waiting} waiting on the producer</div></div>
  </div>`;

  const may=['parallel.search.public_web','evidence.read','policy.evaluate'];
  const mayNot=['final_legal_clearance','iam.modify','oauth.scope.expand'];
  const auth = `<div class="auth">
    <p class="colh">Authority</p>
    <div class="authblk"><div class="h">Acting as</div>
      <div class="row mut">producer_123 → ${esc(RUN.run_id)} → research_agent</div></div>
    <div class="authblk"><div class="h">Effective access</div>
      <div class="row mut">user ∩ script ∩ agent ∩ tool ∩ Cloud IAM ∩ studio policy</div></div>
    <div class="authblk"><div class="h">Researcher may</div>
      ${may.map(t=>`<div class="row"><span class="yes">✓</span> ${esc(t)}</div>`).join('')}
      ${mayNot.map(t=>`<div class="row"><span class="no">✕</span> ${esc(t)}</div>`).join('')}</div>
    ${deny?`<div class="authblk"><div class="h">Denied this run</div>
      <div class="row no">${esc(deny.tool)}</div>
      <div class="row mut">${esc(deny.reason)} · audit #${denyIdx+1}</div></div>`:''}
    <div class="authblk"><div class="h">Cloud IAM (service identity)</div>
      ${iam.map(c=>`<div class="row"><span class="${c.decision==='ALLOW'?'yes':'no'}">${c.decision==='ALLOW'?'✓':'✕'}</span> ${esc(c.resource)}</div>`).join('')}</div>
  </div>`;

  const rows = a.map((e,i)=>{ const b=e.body||{}; const isDeny=b.decision==='DENY';
    const actor = b.agent_id || (String(b.action||'').startsWith('human')?'producer_123':'—');
    return `<tr class="${isDeny?'deny':''}"><td class="seq">#${String(i+1).padStart(3,'0')}</td>
      <td>${esc(b.action||'')}</td><td>${esc(actor)}</td>
      <td>${esc(auditDetail(b))}</td><td class="h">${esc((e.hash||'').slice(0,10))}</td></tr>`; }).join('');
  const audit = `<div class="auditbox">
    <div class="hd"><h3>Audit — ${a.length} events · <span style="color:${g.audit_verified?'var(--clear)':'var(--escalate)'}">${g.audit_verified?'✓ chain verified':'✗ chain broken'}</span></h3>
      <button class="ghost" id="rawBtn">${RAW?'Hide raw JSON':'Show raw JSON'}</button></div>
    ${RAW?`<pre class="raw">${esc(JSON.stringify(a,null,2))}</pre>`
         :`<table class="audit"><tbody>${rows}</tbody></table>`}
  </div>`;

  $('#viewRun').innerHTML = `<div class="run">${exec}${auth}</div>${audit}`;
  $('#rawBtn').onclick=()=>{ RAW=!RAW; renderRun(); };
}
function node(name,ck,det,sub){ return `<div class="node"><div class="nl"><span class="ck">${ck}</span><span class="nm">${esc(name)}</span></div>
  ${det?`<div class="det">${det}</div>`:''}${sub||''}</div>`; }
function auditDetail(b){ const x=[];
  if(b.batch)x.push(b.batch); if(b.item_id)x.push(b.item_id); if(b.tool)x.push(b.tool);
  if(b.state)x.push(b.state); if(typeof b.count==='number')x.push(b.count+' items');
  if(typeof b.sources==='number')x.push(b.sources+' sources'); if(b.reason)x.push(b.reason);
  return x.join(' · '); }

// ---------------- Report view ----------------
function renderReport(){
  const items=RUN.items||[], g=RUN.governance||{}, s=RUN.summary||{};
  const citations=totalSources();
  const backed=items.filter(i=>i.source_count>0).length;
  const decided=items.filter(i=>i.human_decision).length;
  const overrides=items.filter(i=>i.human_decision&&i.human_decision.action==='override').length;
  const T=(l,v)=>`<tr><td>${l}</td><td class="v">${v}</td></tr>`;
  const totals=`<table class="totals">
    ${T('References detected',items.length)}
    ${T('Evidence-backed',backed)}
    ${T('Independent citations',citations)}
    ${T('Clear to continue',s.CLEAR||0)}
    ${T('Review',s.REVIEW||0)}
    ${T('Escalate',s.ESCALATE||0)}
    ${T('Insufficient evidence',s.INSUFFICIENT_EVIDENCE||0)}
    ${T('Human decisions',decided+(overrides?` (${overrides} override)`:''))}
    ${T('Unauthorized tool calls',(g.unauthorized_blocked||0)+' blocked')}
  </table>`;
  const blocks=items.map(it=>{
    const ev=(it.evidence||[]).map((e,i)=>`<div class="rl">[${i+1}] ${esc(e.title||domainOf(e.source_url))} · ${esc(domainOf(e.source_url))} · retrieved ${esc(fmtTime(e.retrieved_at))}</div>`).join('')
      || `<div class="rl mut">Insufficient evidence.</div>`;
    const dec=it.human_decision
      ? `<div class="rl"><b>Decision:</b> ${esc(it.human_decision.action.replace(/_/g,' '))} · producer_123${it.human_decision.reason?' · "'+esc(it.human_decision.reason)+'"':''} · audit #${g.audit_events}</div>`
      : `<div class="rl mut">Decision: pending producer</div>`;
    return `<div class="ritem">
      <div class="rh"><span class="rid">${esc(it.item_id)}</span> ${stamp(it.state)}</div>
      <div class="rt">${esc(it.type.replace(/_/g,' '))} · scene ${esc(String(it.scene))}</div>
      <div class="rl mono">"${esc(it.text_span)}"</div>
      <div class="rl"><b>Recommendation:</b> ${esc(it.state.replace('_',' '))} — ${esc(it.policy_key)} → ${esc(humanReason(it.reason))}</div>
      ${ev}${dec}</div>`;
  }).join('');
  $('#viewReport').innerHTML=`<div class="report">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><h1>Script clearance research report</h1>
        <div class="rsub">${esc(RUN.title)} · v1 · run ${esc((RUN.run_id||'').replace('run_',''))} · generated ${esc(fmtTime(RUN.generated_at))}</div></div>
      <button class="ghost" onclick="window.print()">Print / Save PDF</button>
    </div>
    ${totals}${blocks}
    <div class="foot">Agents research and recommend. The studio clears.</div>
  </div>`;
}

// ---------------- Policy drawer ----------------
async function openPolicy(rid){
  if(!POLICY){ try{ POLICY=await api('/policy'); }catch(e){ POLICY=null; } }
  const sp=(POLICY&&POLICY.studio_policy)||{};
  let d=$('#policyDrawer');
  if(!d){ d=document.createElement('div'); d.id='policyDrawer';
    d.style.cssText='position:fixed;top:0;right:0;width:min(520px,94vw);height:100%;background:var(--panel);border-left:1px solid var(--rule);padding:22px;overflow:auto;box-shadow:-14px 0 40px rgba(28,35,49,.18);z-index:20';
    document.body.appendChild(d); }
  const flagKeys=['evidence_required','human_review_required','rights_review_required','insufficient_evidence_allowed'];
  const rows=Object.keys(sp).map(k=>{ const r=sp[k]; const on=k===rid;
    const flags=flagKeys.filter(f=>r[f]).join(', ');
    return `<tr style="${on?'background:rgba(168,120,10,.12)':''}"><td class="mono" style="padding:6px 8px;border-bottom:1px solid var(--rule)">${esc(k)}</td>
      <td style="padding:6px 8px;border-bottom:1px solid var(--rule)">${stamp(({VERIFY:'CLEAR',REVIEW:'REVIEW',ESCALATE:'ESCALATE'}[r.action])||'REVIEW')}</td>
      <td class="mono" style="padding:6px 8px;border-bottom:1px solid var(--rule)">${r.minimum_independent_sources!=null?r.minimum_independent_sources:'—'}</td>
      <td style="padding:6px 8px;border-bottom:1px solid var(--rule);color:var(--dim);font-size:12px">${esc(flags||'—')}</td></tr>`;}).join('');
  d.innerHTML=`<button class="ghost" style="float:right" onclick="document.getElementById('policyDrawer').remove()">Close</button>
    <h3 style="margin:0 0 2px">Studio policy <span class="mono" style="color:var(--dim);font-size:13px">${esc((POLICY&&POLICY.policy_id)||'')}</span></h3>
    <p style="color:var(--dim);font-size:13px">Deterministic triage — maps item type + evidence to a state. It does not decide legality; humans make the final call.</p>
    <table style="width:100%;border-collapse:collapse"><thead><tr>
      <th style="text-align:left;font-size:11px;color:var(--dim);padding:4px 8px">Type</th>
      <th style="text-align:left;font-size:11px;color:var(--dim);padding:4px 8px">Action</th>
      <th style="text-align:left;font-size:11px;color:var(--dim);padding:4px 8px">Min src</th>
      <th style="text-align:left;font-size:11px;color:var(--dim);padding:4px 8px">Flags</th></tr></thead><tbody>${rows}</tbody></table>`;
}
</script>
