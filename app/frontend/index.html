<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StudioClear — Script Clearance Research Desk</title>
<style>
  /* "Clearance Desk" — a film-studio script-clearance report with a screenplay
     (Courier) voice. The verdicts are inked stamps; the chrome stays quiet warm
     ink so the state colors are the only saturation on the page. */
  :root {
    --paper:#141210; --panel:#1d1a15; --panel2:#25201a; --line:#39322a;
    --ink:#ece5d7; --dim:#a89d89; --brass:#cbb277;
    --clear:#79bd6a; --review:#e0a53f; --escalate:#e26141; --insuf:#ac8ee2;
    --mono:"Courier New","Courier",ui-monospace,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 var(--sans); background:var(--paper); color:var(--ink);
         -webkit-font-smoothing:antialiased; }
  a { color:var(--brass); }

  /* masthead — reads like the header of a clearance document */
  header { padding:20px 26px 16px; border-bottom:1px solid var(--line); background:var(--panel);
           display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; }
  .doc { font:700 20px/1 var(--mono); letter-spacing:3px; }
  .doc .amp { color:var(--brass); }
  .tagline { color:var(--dim); font-size:12.5px; margin-top:5px; font-family:var(--mono); }
  .trust { margin-left:auto; font:600 12.5px/1 var(--mono); display:flex; align-items:center; gap:7px;
           padding:6px 10px; border:1px solid var(--line); border-radius:4px; background:var(--paper); }
  .trust .dot { font-size:12px; }
  .trust-live { color:var(--clear); border-color:rgba(121,189,106,.4); }
  .trust-mock { color:var(--dim); }
  .trust-hybrid { color:var(--review); border-color:rgba(224,165,63,.4); }
  .trust .sub { color:var(--dim); font-weight:400; }

  main { max-width:1120px; margin:0 auto; padding:22px 26px 70px; }

  .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  button { font:700 13px var(--mono); letter-spacing:.4px; background:var(--ink); color:var(--paper);
           border:0; border-bottom:2px solid #a49a86; padding:9px 16px; border-radius:5px; cursor:pointer; }
  button:hover { filter:brightness(1.06); }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); border-bottom:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  label.chk { color:var(--dim); font-size:13px; display:flex; gap:6px; align-items:center; }
  .badges { margin-left:auto; color:var(--dim); font-size:11.5px; font-family:var(--mono); }
  #status { color:var(--dim); font-size:12.5px; font-family:var(--mono); }

  /* section headers as screenplay scene slugs (uppercase Courier is heritage, not an eyebrow) */
  .sec { margin:26px 0 12px; }
  .sec h2 { font:700 12px var(--mono); letter-spacing:2px; color:var(--ink); margin:0 0 3px;
            padding-bottom:6px; border-bottom:1px solid var(--line); text-transform:uppercase; }
  .sec h2 .marker { color:var(--brass); margin-right:8px; }
  .sec .hint { color:var(--dim); font-size:12px; font-family:var(--sans); text-transform:none; letter-spacing:0; font-weight:400; }
  code { font-family:var(--mono); color:var(--brass); }

  /* agent pipeline — left-to-right order carries the sequence; no arrow decoration */
  .agents { display:flex; flex-wrap:wrap; gap:14px; }
  .agent-card { flex:1 1 250px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .agent-card .role { font:700 11px var(--mono); letter-spacing:1.5px; color:var(--brass); text-transform:uppercase; }
  .agent-card .name { font:700 15px var(--mono); margin-top:3px; }
  .agent-card .model { color:var(--dim); font:11px var(--mono); }
  .agent-card .did { margin-top:11px; font-size:14px; }
  .agent-card .big { font:700 26px var(--mono); }
  .agent-card .cap { color:var(--dim); font-size:11.5px; margin-top:10px; line-height:1.5; }

  .chip { display:inline-block; padding:3px 10px; border-radius:4px; background:var(--panel2);
          border:1px solid var(--line); font:12px var(--mono); margin:4px 4px 0 0; }
  .chip b { color:var(--ink); } .chip .c { color:var(--brass); }

  /* governance — the DENY is the hero moment */
  .deny-hero { border:1px solid var(--escalate); background:rgba(226,97,65,.09); border-radius:8px; padding:14px 16px; }
  .deny-hero .h { color:var(--escalate); font:700 13px var(--mono); letter-spacing:.5px; }
  details.audit { margin-top:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:11px 15px; }
  details.audit summary { cursor:pointer; font:600 13px var(--mono); }
  .timeline { margin-top:11px; border-top:1px solid var(--line); }
  .tl { display:flex; gap:12px; padding:5px 0; border-bottom:1px solid var(--line); font-size:12px; align-items:baseline; }
  .tl .act { min-width:158px; font:600 12px var(--mono); }
  .tl .det { color:var(--dim); flex:1; }
  .tl .hash { color:var(--brass); font:11px var(--mono); }
  .tl.deny .act { color:var(--escalate); }
  .verdict { margin-top:11px; font-size:13px; font-family:var(--mono); }

  /* triage tiles */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:13px 15px; }
  .tile .n { font:700 26px var(--mono); }
  .tile .l { color:var(--dim); font:11px var(--mono); letter-spacing:.6px; text-transform:uppercase; margin-top:2px; }
  .tile.clear .n{color:var(--clear)} .tile.review .n{color:var(--review)}
  .tile.escalate .n{color:var(--escalate)} .tile.insuf .n{color:var(--insuf)}

  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  th,td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); font-size:13.5px; }
  th { color:var(--dim); font:600 11px var(--mono); text-transform:uppercase; letter-spacing:.6px; }
  tr.item { cursor:pointer; } tr.item:hover { background:var(--panel2); }
  tr.item.hl { background:rgba(203,178,119,.12); }
  td.mono { font-family:var(--mono); color:var(--dim); }

  /* verdicts as inked stamps */
  .pill { font:700 11px var(--mono); letter-spacing:.6px; text-transform:uppercase;
          border:1.5px solid currentColor; border-radius:3px; padding:2px 8px; white-space:nowrap; }
  .CLEAR{color:var(--clear)} .REVIEW{color:var(--review)}
  .ESCALATE{color:var(--escalate)} .INSUFFICIENT_EVIDENCE{color:var(--insuf)}
  .pill.action { color:var(--ink); }
  .hd { color:var(--dim); font-size:12.5px; font-family:var(--mono); }

  .drawer { position:fixed; top:0; right:0; width:min(560px,94vw); height:100%; background:var(--panel);
            border-left:1px solid var(--line); padding:22px; overflow:auto; transform:translateX(100%);
            transition:transform .2s ease; z-index:10; box-shadow:-14px 0 40px rgba(0,0,0,.4); }
  .drawer.open { transform:none; }
  .drawer h3 { margin:0 0 3px; font-family:var(--mono); } .drawer .close { float:right; }
  .drawer h4 { font:700 11px var(--mono); letter-spacing:1px; text-transform:uppercase; color:var(--brass); margin:16px 0 4px; }
  .ev { background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:11px; margin:8px 0; }
  .ev a { word-break:break-all; text-decoration:none; }
  .ev .pub { color:var(--dim); font:11px var(--mono); margin-top:2px; }
  .kv { color:var(--dim); font-size:12.5px; margin:6px 0; }
  .kv b { color:var(--ink); font-family:var(--mono); font-weight:700; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .acts button { font-size:12px; padding:7px 12px; }
  .muted { color:var(--dim); }
  .ok { color:var(--clear); font-weight:700; } .bad { color:var(--escalate); font-weight:700; }
  .ptable td, .ptable th { font-size:12.5px; }
  .ptable .flags { color:var(--dim); font:11px var(--mono); }
  @media (max-width:640px){ .doc{font-size:17px;letter-spacing:2px} }
</style>
</head>
<body>
<header>
  <div>
    <div class="doc">STUDIO<span class="amp">·</span>CLEAR</div>
    <div class="tagline">Agents research and recommend. The studio clears.</div>
  </div>
  <div class="trust" id="trustbar"></div>
</header>
<main>
  <div class="controls">
    <button id="run">Run demo script</button>
    <label class="chk"><input type="checkbox" id="live" /> Use live Gemini + Parallel</label>
    <label class="chk"><input type="checkbox" id="adk" /> Agentic (ADK)</label>
    <button class="ghost" id="policyBtn">Studio policy</button>
    <span id="status">Ready.</span>
    <span class="badges" id="providers"></span>
  </div>

  <section class="sec" id="agentsSec" hidden>
    <h2><span class="marker">INT.</span>AGENT PIPELINE <span class="hint">three Google ADK agents (real <code>google.adk</code> Agents)</span></h2>
    <div class="agents" id="agents"></div>
  </section>

  <section class="sec" id="govSec" hidden>
    <h2><span class="marker">INT.</span>GOVERNANCE</h2>
    <div id="gov"></div>
  </section>

  <section class="sec" id="planSec" hidden>
    <h2><span class="marker">INT.</span>RESEARCH PLAN <span class="hint">how the Planner grouped the work</span></h2>
    <div id="plan"></div>
  </section>

  <section class="sec" id="tilesSec" hidden>
    <h2><span class="marker">INT.</span>TRIAGE SUMMARY</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <table id="table" hidden>
    <thead><tr>
      <th>Item</th><th>Sc</th><th>Type</th><th>Reference</th>
      <th>Recommendation</th><th>Src</th><th>Conf.</th><th>Batch</th><th>Human</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<div class="drawer" id="drawer">
  <button class="ghost close" onclick="closeDrawer()">Close</button>
  <div id="drawerBody"></div>
</div>

<div class="drawer" id="policyDrawer">
  <button class="ghost close" onclick="closePolicy()">Close</button>
  <div id="policyBody"></div>
</div>

<script>
let RUN = null, POLICY = null, HEALTH = null, PROVIDERS = null;
const $ = s => document.querySelector(s);
const api = (p, opts) => fetch(p, opts).then(r => r.json());

// one-time: learn the ADK version so the trust bar doesn't hardcode it
(async () => { try { HEALTH = await api('/health'); } catch (e) { HEALTH = null; } })();

$('#run').onclick = async () => {
  $('#run').disabled = true;
  const live = $('#live').checked;
  const adk = $('#adk').checked;
  $('#status').textContent = adk ? 'Running agentic ADK pipeline…'
    : live ? 'Extracting with live Gemini…' : 'Running (offline mock)…';
  try {
    const res = await api('/upload', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ prefer_live: live, use_adk: adk, title: 'Midnight Signal' })
    });
    PROVIDERS = res.providers;
    RUN = await api('/run/' + res.run_id);
    render();
    $('#status').textContent = 'Run ' + res.run_id;
    $('#providers').textContent = 'llm: ' + res.providers.llm + ' · search: ' + res.providers.search;
  } catch (e) {
    $('#status').textContent = 'Error: ' + e;
  }
  $('#run').disabled = false;
};

function render() {
  renderTrustBar();
  renderAgents();
  renderGovernance();
  renderPlan();
  renderTiles();
  renderTable();
}

// --- Trust bar: is this a real run or the deterministic offline take? ---
function renderTrustBar() {
  const p = PROVIDERS || {};
  const llmLive = p.llm === 'GeminiLLMProvider';
  const adkInPath = p.search === 'ADKSearchProvider';
  const searchLive = p.search === 'ParallelSearchProvider' || adkInPath;
  const ver = (HEALTH && HEALTH.adk_version) ? HEALTH.adk_version : '';
  let cls, dot = '●', label, sub;
  if (llmLive && searchLive) {
    cls = 'trust-live'; label = 'LIVE';
    sub = 'Gemini 2.5 Pro / Parallel Search / ' + (adkInPath ? ('ADK ' + ver + ' in path') : ('ADK ' + ver + ' ready'));
  } else if (llmLive && !searchLive) {
    cls = 'trust-hybrid'; label = 'LIVE Gemini'; sub = 'mock search';
  } else {
    cls = 'trust-mock'; label = 'cached / mock'; sub = 'deterministic offline run';
  }
  $('#trustbar').className = 'trust ' + cls;
  $('#trustbar').innerHTML = `<span class="dot">${dot}</span> ${label} <span class="sub">${esc(sub)}</span>`;
}

// --- Agent pipeline: derived entirely from the run report (no fabrication) ---
function renderAgents() {
  const batches = RUN.batches || [];
  const m = RUN.metrics || {}, s = RUN.summary || {};
  const sources = (RUN.items || []).reduce((a, it) => a + (it.source_count || 0), 0);
  const batchChips = batches.map(b =>
    `<span class="chip"><b>${esc(b.name)}</b> <span class="c">${(b.items||[]).length}</span></span>`).join('') ||
    '<span class="muted">—</span>';
  const distPills = ['CLEAR','REVIEW','ESCALATE','INSUFFICIENT_EVIDENCE']
    .filter(k => s[k]).map(k => `<span class="pill ${k}">${s[k]} ${k.replace('_EVIDENCE','').replace('_',' ')}</span>`).join(' ');

  const planner = card('Planner', 'research_planner', 'gemini-2.5-pro',
    `<div><span class="big">${batches.length}</span> research batches</div><div style="margin-top:7px">${batchChips}</div>`,
    'Groups extracted references into batches so related items are researched together.');
  const researcher = card('Researcher', 'researcher', 'gemini-2.5-flash',
    `<div><span class="big">${RUN.items ? RUN.items.length : 0}</span> items researched, <b>${sources}</b> cited sources</div>
     <div style="margin-top:5px" class="muted">${m.evidence_backed || 0}/${m.references_detected || 0} evidence-backed, multi-source ${m.multi_source_satisfied||0}/${m.multi_source_required||0}</div>`,
    'Calls parallel_search as an ADK tool. URLs come only from the tool response — the model never emits a citation (evidence-integrity invariant).');
  const reviewer = card('Reviewer', 'reviewer', 'gemini-2.5-flash',
    `<div>${distPills || '<span class="muted">—</span>'}</div>`,
    'Triage state comes from the deterministic apply_policy tool, not the model. No "cleared by AI" state exists — humans decide.');

  $('#agents').innerHTML = planner + researcher + reviewer;
  $('#agentsSec').hidden = false;
}
function card(role, name, model, did, cap) {
  return `<div class="agent-card">
    <div class="role">${esc(role)}</div>
    <div class="name">${esc(name)}</div>
    <div class="model">${esc(model)}</div>
    <div class="did">${did}</div>
    <div class="cap">${esc(cap)}</div>
  </div>`;
}

// --- Governance: the real DENY + the verifiable audit chain ---
function renderGovernance() {
  const chain = RUN.audit_chain || [];
  const g = RUN.governance || {};
  const deny = chain.find(e => e && e.body && e.body.decision === 'DENY');
  let html = '';
  if (deny) {
    const b = deny.body;
    html += `<div class="deny-hero">
      <div class="h">TOOL CALL DENIED &amp; AUDITED</div>
      <div style="margin-top:6px"><code>${esc(b.agent_id||'agent')}</code> requested
        <code>${esc(b.tool||'?')}</code> → <b>${esc(b.reason||'denied')}</b></div>
      <div class="muted" style="margin-top:5px">Not in the approved-tool registry — a genuine block, not a mock (${g.unauthorized_blocked||0} blocked this run).</div>
    </div>`;
  }
  const rows = chain.map(e => {
    const b = (e && e.body) || {};
    const isDeny = b.decision === 'DENY';
    return `<div class="tl ${isDeny?'deny':''}">
      <span class="act">${esc(b.action||'event')}</span>
      <span class="det">${esc(auditDetail(b))}</span>
      <span class="hash">${esc((e.hash||'').slice(0,10))}</span>
    </div>`;
  }).join('');
  const verified = g.audit_verified;
  html += `<details class="audit">
    <summary>Verify audit chain — ${chain.length} tamper-evident events</summary>
    <div class="timeline">${rows}</div>
    <div class="verdict">
      <span class="${verified?'ok':'bad'}">${verified?'✓ tamper-evident chain verified':'✗ chain broken'}</span>
      <span class="muted"> · ${g.audit_events||chain.length} events · head ${esc((g.audit_head||'').slice(0,12))}…</span>
    </div>
  </details>`;
  $('#gov').innerHTML = html;
  $('#govSec').hidden = false;
}
function auditDetail(b) {
  const bits = [];
  if (b.batch) bits.push(b.batch);
  if (b.item_id) bits.push(b.item_id);
  if (b.tool) bits.push(b.tool);
  if (b.decision) bits.push(b.decision);
  if (b.state) bits.push(b.state);
  if (typeof b.count === 'number') bits.push(b.count + ' items');
  if (typeof b.sources === 'number') bits.push(b.sources + ' sources');
  if (b.reason) bits.push(b.reason);
  return bits.join(' · ');
}

// --- Plan: the Planner's batches, clickable to highlight table rows ---
function renderPlan() {
  const batches = RUN.batches || [];
  $('#plan').innerHTML = batches.map((b, i) =>
    `<span class="chip" style="cursor:pointer" onclick="highlightBatch(${i})">
       <b>${esc(b.name)}</b> <span class="c">${(b.items||[]).length} item(s)</span></span>`).join('') ||
    '<span class="muted">No research batches.</span>';
  $('#planSec').hidden = false;
}
function highlightBatch(i) {
  const ids = new Set(((RUN.batches[i]||{}).items) || []);
  document.querySelectorAll('tr.item').forEach(tr =>
    tr.classList.toggle('hl', ids.has(tr.dataset.id)));
}

function renderTiles() {
  const s = RUN.summary, m = RUN.metrics, g = RUN.governance;
  const tile = (n,l,cls) => `<div class="tile ${cls}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  $('#tiles').innerHTML =
    tile(s.CLEAR||0,'Clear','clear') + tile(s.REVIEW||0,'Review','review') +
    tile(s.ESCALATE||0,'Escalate','escalate') + tile(s.INSUFFICIENT_EVIDENCE||0,'Insufficient','insuf') +
    tile(m.references_detected,'References','') + tile(m.evidence_backed,'Evidence-backed','') +
    tile(m.multi_source_satisfied+'/'+m.multi_source_required,'Multi-source','') +
    tile(g.unauthorized_blocked,'Blocked','');
  $('#tilesSec').hidden = false;
}

function renderTable() {
  const batchOf = {};
  (RUN.batches||[]).forEach(b => (b.items||[]).forEach(id => batchOf[id] = b.name));
  $('#rows').innerHTML = RUN.items.map((it,i) => `
    <tr class="item" data-id="${esc(it.item_id)}" onclick="openDrawer(${i})">
      <td class="mono">${esc(it.item_id)}</td><td class="mono">${esc(String(it.scene))}</td><td class="muted">${esc(it.type)}</td>
      <td>${esc(it.text_span)}</td>
      <td><span class="pill ${it.state}">${it.state.replace('_',' ')}</span></td>
      <td class="mono">${it.source_count}</td><td class="mono">${it.confidence.toFixed(2)}</td>
      <td class="hd">${esc(batchOf[it.item_id] || '—')}</td>
      <td class="hd">${it.human_decision ? esc(it.human_decision.action) : '—'}</td>
    </tr>`).join('');
  $('#table').hidden = false;
}

function openDrawer(i) {
  const it = RUN.items[i];
  const ev = it.evidence.map(e => `
    <div class="ev"><a href="${esc(e.source_url)}" target="_blank" rel="noopener">${esc(e.title||e.source_url)}</a>
      <div class="pub">${esc(e.publisher||'')} · ${esc(e.retrieved_at||'')}</div>
      <div class="muted">${esc(e.excerpt||'')}</div></div>`).join('') ||
    '<div class="muted">No authoritative sources — insufficient evidence.</div>';
  $('#drawerBody').innerHTML = `
    <h3>${esc(it.item_id)} <span class="pill ${it.state}">${it.state.replace('_',' ')}</span></h3>
    <div class="muted">${esc(it.type)} · scene ${esc(String(it.scene))}</div>
    <p>${esc(it.text_span)}</p>
    <div class="kv"><b>Research query:</b> ${esc(it.query)}</div>
    <div class="kv"><b>Policy basis:</b> ${esc(it.policy_key)} → ${esc(it.reason)}</div>
    <div class="kv"><b>Confidence:</b> ${it.confidence.toFixed(2)} · ${it.source_count} independent source(s)</div>
    <h4>Evidence</h4>${ev}
    <div class="acts">
      <button onclick="decide('${it.item_id}','clear')">Clear</button>
      <button class="ghost" onclick="decide('${it.item_id}','send_to_review')">Send to review</button>
      <button class="ghost" onclick="decide('${it.item_id}','escalate')">Escalate</button>
      <button class="ghost" onclick="override('${it.item_id}')">Override…</button>
    </div>`;
  $('#drawer').classList.add('open');
}
function closeDrawer(){ $('#drawer').classList.remove('open'); }

async function decide(item_id, action, reason='') {
  await api('/decision', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ run_id: RUN.run_id, item_id, action, reason }) });
  RUN = await api('/run/' + RUN.run_id);
  render(); closeDrawer();
}
function override(item_id){
  const reason = prompt('Override reason (required):');
  if (reason && reason.trim()) decide(item_id, 'override', reason.trim());
}

// --- Studio policy drawer (the deterministic config behind every state) ---
$('#policyBtn').onclick = openPolicy;
async function openPolicy() {
  if (!POLICY) { try { POLICY = await api('/policy'); } catch (e) { POLICY = null; } }
  const sp = (POLICY && POLICY.studio_policy) || {};
  const flagKeys = ['evidence_required','human_review_required','rights_review_required','insufficient_evidence_allowed'];
  const rows = Object.keys(sp).map(k => {
    const r = sp[k];
    const flags = flagKeys.filter(f => r[f]).join(', ');
    const mins = (r.minimum_independent_sources != null) ? r.minimum_independent_sources : '—';
    return `<tr><td class="mono">${esc(k)}</td>
      <td><span class="pill action">${esc(r.action||'')}</span></td>
      <td class="mono">${esc(String(mins))}</td>
      <td class="flags">${esc(flags||'—')}</td></tr>`;
  }).join('');
  $('#policyBody').innerHTML = `
    <h3>Studio policy <span class="muted">${esc((POLICY&&POLICY.policy_id)||'')}</span></h3>
    <p class="muted">Deterministic triage policy — maps item type + evidence to a state.
      It does <b>not</b> decide legality; humans make the final call (§12/§14).</p>
    <table class="ptable"><thead><tr><th>Type</th><th>Action</th><th>Min src</th><th>Flags</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="muted">Policy unavailable.</td></tr>'}</tbody></table>`;
  $('#policyDrawer').classList.add('open');
}
function closePolicy(){ $('#policyDrawer').classList.remove('open'); }

function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
</script>
</body>
</html>
